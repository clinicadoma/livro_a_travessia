<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- LANCAMENTO_VERSAO: 2026-09-29-monstro-72vw -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançamento Plataforma Doma</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --candy-pink: #ff7eb3;
            --candy-purple: #8e2de2;
            --candy-blue: #00c6ff;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.4);
            --neon-glow: 0 0 10px rgba(0, 198, 255, 0.8), 0 0 20px rgba(0, 198, 255, 0.6), 0 0 30px #00c6ff;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(-45deg, var(--candy-pink), #ff758c, var(--candy-purple), #4a00e0, var(--candy-blue), #0072ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Animação do Fundo */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animação do Doma (Flutuando) */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border-radius: 24px;
        }

        .neon-text {
            text-shadow: var(--neon-glow);
            font-weight: 700;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 10px 15px;
            min-width: 80px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .mini-monster-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
        }

        .mini-monster {
            width: 60px;
            height: 60px;
            border-radius: 50% 50% 40% 40%;
            position: relative;
            animation: bounce 1s infinite alternate cubic-bezier(0.5, 0.05, 1, 0.5);
            box-shadow: 0 10px 15px rgba(0,0,0,0.2), inset -5px -5px 10px rgba(0,0,0,0.1);
        }

        .mm-yellow { background: #ffde00; animation-delay: 0s; }
        .mm-orange { background: #ff9900; animation-delay: 0.3s; }
        .mm-green  { background: #88cc00; animation-delay: 0.6s; }

        .eye {
            width: 14px;
            height: 18px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 15px;
            border: 2px solid #333;
        }
        .eye::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 4px;
            right: 2px;
        }
        .eye.left { left: 12px; }
        .eye.right { right: 12px; }
        
        .mouth {
            width: 12px;
            height: 6px;
            border-bottom: 3px solid #333;
            border-radius: 0 0 10px 10px;
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-25px) scaleY(1.05); }
        }

        .floating-element {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: floatUp 10s linear infinite;
            z-index: -1;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-20vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* Botão Gamificado */
        .btn-game {
            background: linear-gradient(to bottom, #ffea00, #ff9900);
            border: 4px solid #fff;
            box-shadow: 0 8px 0 #cc7a00, 0 15px 20px rgba(0,0,0,0.4);
            transition: all 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #553300;
        }
        .btn-game:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #cc7a00, 0 5px 10px rgba(0,0,0,0.4);
        }

        /* Overlay de Início (Para habilitar o Áudio) */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        
        #custom-alert {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
        }

        /* Ajuste para telas baixas (celular): tudo cabe sem estourar a altura */
        html, body { max-width: 100%; }
        html { height: 100%; } body { min-height: 100vh !important; justify-content: flex-start; }
        main { flex: 1 1 auto; margin-top: var(--vt, 0px); min-height: var(--vh, 100vh); box-sizing: border-box; justify-content: space-evenly !important; }
        #start-overlay { top: var(--vt, 0px) !important; height: var(--vh, 100%) !important; }
        @media (max-width: 600px) {
            main { padding-top: 12px !important; padding-bottom: 12px !important; }
            main h1 { margin-bottom: 10px !important; font-size: 1.5rem !important; line-height: 1.2 !important; }
            main h1 span { font-size: 1.9rem !important; }
            main .mb-8 { margin-bottom: 10px !important; }
            .glass-panel { padding: 12px !important; }
            .time-box { min-width: 64px; padding: 6px 8px; }
            .time-box span:first-child { font-size: 2rem !important; }
            .mini-monster-container { margin-top: 10px; gap: 14px; }
            .mini-monster { width: 44px; height: 44px; }
            .eye { width: 10px; height: 13px; top: 10px; }
            .eye::after { width: 4px; height: 4px; top: 3px; }
            .eye.left { left: 8px; } .eye.right { right: 8px; }
            #back-btn { margin-top: 16px !important; padding: 10px 24px !important; font-size: 1.1rem !important; }
        }

        /* Celular / iframe baixo: compacta ao máximo para caber sem rolar */
        @media (max-width: 600px) {
            main h1 { font-size: 1.2rem !important; margin-bottom: 6px !important; }
            main h1 span { font-size: 1.5rem !important; }
            main img { width: min(450px, 72vw) !important; max-width: none !important; height: auto !important; }
            main .mb-8 { margin-bottom: 4px !important; }
            .glass-panel { padding: 8px !important; }
            .glass-panel > div.flex { margin-top: 0 !important; gap: 8px !important; }
            .time-box { min-width: 54px; padding: 4px 6px; }
            .time-box span:first-child { font-size: 1.6rem !important; }
            .time-box span:last-child { font-size: 0.7rem !important; margin-top: 0 !important; }
            .mini-monster-container { margin-top: 6px; gap: 10px; }
            .mini-monster { width: 34px; height: 34px; }
            .eye { width: 8px; height: 10px; top: 8px; }
            .eye::after { width: 3px; height: 3px; top: 2px; }
            .eye.left { left: 6px; } .eye.right { right: 6px; }
            .mouth { bottom: 8px; }
            #back-btn { margin-top: 10px !important; padding: 8px 20px !important; font-size: 1rem !important; border-width: 3px; }
        }
        #start-overlay h1 { font-size: clamp(1.6rem, 6vw, 3.5rem); }

        /* Fontes menores no celular */
        @media (max-width: 600px) {
            main h1 { font-size: 1.15rem !important; }
            main h1 span { font-size: 1.45rem !important; }
            .time-box span:first-child { font-size: 1.5rem !important; }
            .time-box span:last-child { font-size: 0.65rem !important; }
            #back-btn { font-size: 0.95rem !important; padding: 8px 20px !important; }
            #start-overlay h1 { font-size: 1.5rem !important; padding: 8px !important; margin-bottom: 16px !important; }
            #start-btn { font-size: 1.1rem !important; padding: 10px 24px !important; }
            #start-overlay p { font-size: 0.75rem !important; }
            #custom-alert h2 { font-size: 1.4rem !important; }
            #custom-alert p { font-size: 0.9rem !important; }
        }
    </style>
</head>
<body class="relative">
    <div id="area-visivel" style="position:fixed;inset:0;pointer-events:none;opacity:0;"></div>

    <!-- BOTÃO DE MUTE -->
    <button id="mute-btn" class="fixed top-4 right-4 z-50 bg-white/20 hover:bg-white/40 backdrop-blur-md border border-white/50 rounded-full w-12 h-12 flex items-center justify-center text-2xl transition-all shadow-lg cursor-pointer" style="display: none;">
        🔊
    </button>

    <!-- OVERLAY DE INÍCIO -->
    <div id="start-overlay">
        <h1 class="text-4xl md:text-6xl text-center text-white neon-text mb-8 p-4">Pronto para a Magia?</h1>
        <button id="start-btn" class="btn-game px-8 py-4 rounded-full text-2xl font-bold">Entrar na Plataforma</button>
        <p class="text-sm mt-4 text-gray-300">Ligue o som do seu dispositivo 🔊</p>
    </div>

    <!-- FUNDO ANIMADO (Elementos Flutuantes) -->
    <div id="background-elements"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="relative z-10 flex flex-col items-center w-full max-w-4xl px-4 py-8">
        
        <!-- Título -->
        <h1 class="text-3xl md:text-5xl text-center mb-6 neon-text leading-tight">
            Faltam poucos dias para a <br>
            <span class="text-yellow-300 text-4xl md:text-6xl">Revolução Gamificada!</span>
        </h1>

        <!-- Imagem Central do Doma (Com drop-shadow PNG e mb-8 para não sobrepor) -->
        <div class="relative z-20 mb-8">
            <img src='https://static.wixstatic.com/media/253e81_6b98213710ea43b4a9ceaedb738843d5~mv2.png' alt='Monstro Doma' style='width: min(450px, 60vw); max-width: none; height: auto; animation: float 3s ease-in-out infinite; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.5));'>
        </div>

        <!-- Painel de Contagem Regressiva -->
        <div class="glass-panel w-full p-6 md:p-8 flex flex-col items-center relative z-10">
            
            <div class="flex flex-wrap justify-center gap-3 md:gap-6 mt-4">
                <div class="time-box">
                    <span id="days" class="text-4xl md:text-6xl font-bold neon-text text-white">00</span>
                    <span class="text-sm md:text-base text-gray-200 uppercase mt-1">Dias</span>
                </div>
                <div class="time-box">
                    <span id="hours" class="text-4xl md:text-6xl font-bold neon-text text-white">00</span>
                    <span class="text-sm md:text-base text-gray-200 uppercase mt-1">Horas</span>
                </div>
                <div class="time-box">
                    <span id="minutes" class="text-4xl md:text-6xl font-bold neon-text text-white">00</span>
                    <span class="text-sm md:text-base text-gray-200 uppercase mt-1">Min</span>
                </div>
                <div class="time-box">
                    <span id="seconds" class="text-4xl md:text-6xl font-bold neon-text text-pink-300">00</span>
                    <span class="text-sm md:text-base text-gray-200 uppercase mt-1">Seg</span>
                </div>
            </div>

            <!-- Monstrinhos Auxiliares -->
            <div class="mini-monster-container">
                <div class="mini-monster mm-yellow">
                    <div class="eye left"></div><div class="eye right"></div><div class="mouth"></div>
                </div>
                <div class="mini-monster mm-orange">
                    <div class="eye left"></div><div class="eye right"></div><div class="mouth"></div>
                </div>
                <div class="mini-monster mm-green">
                    <div class="eye left"></div><div class="eye right"></div><div class="mouth"></div>
                </div>
            </div>
        </div>

        <!-- Botão Interativo -->
        <button id="back-btn" class="btn-game mt-12 px-8 md:px-12 py-4 md:py-5 rounded-full text-xl md:text-2xl font-bold">
            Voltar para os Planos
        </button>

    </main>

    <!-- Custom Modal / Message Box -->
    <div id="custom-alert" class="glass-panel p-8 text-center max-w-sm w-[90%]">
        <h2 class="text-3xl font-bold text-yellow-300 mb-4">Redirecionando!</h2>
        <p class="text-lg text-white mb-6">Você está sendo levado de volta para ver os planos incríveis da Plataforma Doma.</p>
        <button id="close-alert-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-full transition-colors">
            OK, Vamos lá!
        </button>
    </div>

    <script>
        // 1. Geração de Elementos Flutuantes do Fundo
        const bgContainer = document.getElementById('background-elements');
        const colors = ['rgba(255, 255, 255, 0.2)', 'rgba(255, 255, 255, 0.4)', 'rgba(0, 198, 255, 0.3)'];
        for(let i = 0; i < 20; i++) {
            let el = document.createElement('div');
            el.className = 'floating-element';
            
            // Randomizar tamanho, posição e duração
            let size = Math.random() * 40 + 10; // entre 10 e 50px
            let left = Math.random() * 100; // 0 a 100vw
            let duration = Math.random() * 10 + 10; // 10s a 20s
            let delay = Math.random() * 5; // 0s a 5s delay

            el.style.width = `${size}px`;
            el.style.height = `${size}px`;
            el.style.left = `${left}vw`;
            el.style.animationDuration = `${duration}s`;
            el.style.animationDelay = `${delay}s`;
            el.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            // Variar entre círculos e quadrados arredondados (parecendo balinhas)
            if(Math.random() > 0.5) el.style.borderRadius = '20%';

            bgContainer.appendChild(el);
        }

        // 2. Lógica de Áudio (Tone.js)
        let synthBGM, synthTick, synthPop;
        let bgmLoop;
        let isAudioReady = false;

        async function initAudio() {
            await Tone.start();
            
            // Sintetizador para a Música de Fundo (BGM)
            synthBGM = new Tone.PolySynth(Tone.FMSynth, {
                harmonicity: 8,
                modulationIndex: 2,
                oscillator: { type: "sine" },
                envelope: { attack: 0.1, decay: 0.2, sustain: 0.1, release: 1 },
                modulation: { type: "square" },
                modulationEnvelope: { attack: 0.1, decay: 0.2, sustain: 0.1, release: 0.5 }
            }).toDestination();
            synthBGM.volume.value = -20; // Volume mais baixo para não incomodar

            // Sintetizador para o 'Tick' do relógio
            synthTick = new Tone.MembraneSynth().toDestination();
            synthTick.volume.value = -15;

            // Sintetizador para o 'Pop' do botão
            synthPop = new Tone.PluckSynth().toDestination();
            synthPop.volume.value = -5;

            // Melodia de fundo (Estilo Candy Crush feliz)
            const melody = [
                ["0:0:0", "C4"], ["0:0:2", "E4"], ["0:1:0", "G4"], ["0:1:2", "A4"],
                ["0:2:0", "G4"], ["0:2:2", "E4"], ["0:3:0", "C4"], ["0:3:2", "D4"]
            ];
            
            Tone.Transport.bpm.value = 120;
            const part = new Tone.Part(((time, note) => {
                synthBGM.triggerAttackRelease(note, "8n", time);
            }), melody).start(0);
            
            part.loop = true;
            part.loopEnd = "1m";
            
            Tone.Transport.start();
            isAudioReady = true;
        }

        // 3. Interações da Interface
        // Data de lançamento (única fonte da verdade: usada pela contagem e pelo botão de entrada)
        const targetDate = new Date('2026-10-13T00:00:00');

        document.getElementById('start-btn').addEventListener('click', async () => {
            // PÓS-LANÇAMENTO: o "Pronto para a Magia?" continua aparecendo, mas o
            // botão leva direto ao livro ("O Despertar do Domador"), sem mostrar
            // a contagem. Quem cuida de carregar o livro é o wix-loader (janela pai).
            if (new Date() >= targetDate) {
                try { window.parent.postMessage({ acao: 'domaLancamentoEntrar' }, '*'); } catch (e) {}
                return;
            }
            // PRÉ-LANÇAMENTO: comportamento original (revela a contagem regressiva)
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('mute-btn').style.display = 'flex';
            await initAudio();
        });

        // Lógica do Botão de Mute
        let isMuted = false;
        document.getElementById('mute-btn').addEventListener('click', () => {
            isMuted = !isMuted;
            Tone.Destination.mute = isMuted;
            document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';
        });

        document.getElementById('back-btn').addEventListener('click', () => {
            if(isAudioReady) {
                // Toca som de pop
                synthPop.triggerAttackRelease("C5", "8n");
            }
            // Mostra o modal customizado (sem usar alert!)
            document.getElementById('custom-alert').style.display = 'block';
        });

        document.getElementById('close-alert-btn').addEventListener('click', () => {
            document.getElementById('custom-alert').style.display = 'none';
            // Aqui você poderia colocar o código para redirecionar de volta.
            // ex: window.location.href = 'index.html';
        });

        // 4. Lógica da Contagem Regressiva (Para 13 de Outubro de 2026)
        const elDays = document.getElementById('days');
        const elHours = document.getElementById('hours');
        const elMinutes = document.getElementById('minutes');
        const elSeconds = document.getElementById('seconds');

        function updateCountdown() {
            const now = new Date();
            const difference = targetDate - now;

            if (difference <= 0) {
                // O tempo acabou!
                elDays.innerText = "00";
                elHours.innerText = "00";
                elMinutes.innerText = "00";
                elSeconds.innerText = "00";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((difference / 1000 / 60) % 60);
            const seconds = Math.floor((difference / 1000) % 60);

            // Formatando com zero à esquerda se menor que 10
            elDays.innerText = days < 10 ? '0' + days : days;
            elHours.innerText = hours < 10 ? '0' + hours : hours;
            elMinutes.innerText = minutes < 10 ? '0' + minutes : minutes;
            elSeconds.innerText = seconds < 10 ? '0' + seconds : seconds;

            // Efeito visual sutil nos segundos e Som de Tick
            elSeconds.style.transform = 'scale(1.2)';
            setTimeout(() => {
                elSeconds.style.transform = 'scale(1)';
            }, 100);

            if(isAudioReady && difference > 0) {
                // Toca o som do 'Tick' agudo e curtinho
                synthTick.triggerAttackRelease("C6", "32n");
            }
        }

        // Iniciar o relógio
        setInterval(updateCountdown, 1000);
        updateCountdown(); // Chamada inicial para evitar delay de 1 segundo

        // 5. Avisa o loader (e este, o Wix) a altura REAL do conteúdo desta tela
        function reportarAltura() {
            try {
                // Altura NATURAL do conteúdo (soma dos blocos), independente de o main
                // estar esticado para preencher o iframe.
                const m = document.querySelector('main');
                const cs = getComputedStyle(m);
                let h = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
                Array.from(m.children).forEach(c => {
                    const k = getComputedStyle(c);
                    h += c.getBoundingClientRect().height + parseFloat(k.marginTop) + parseFloat(k.marginBottom);
                });
                h = Math.ceil(h) + 16;
                if (h !== window.__ultimaAlturaLanc) {
                    window.__ultimaAlturaLanc = h;
                    window.parent.postMessage({ acao: 'domaLancamentoAltura', height: h }, '*');
                }
            } catch (e) {}
        }
        setInterval(reportarAltura, 300);
        reportarAltura();

        // 6. Posiciona o conteúdo na parte do frame que está REALMENTE visível na tela
        // (o frame pode ser um pouco mais alto que a tela e começar acima/abaixo dela).
        (function () {
            if (!('IntersectionObserver' in window)) return;
            const alvo = document.getElementById('area-visivel');
            const th = []; for (let i = 0; i <= 100; i++) th.push(i / 100);
            new IntersectionObserver(function (entries) {
                const e = entries[entries.length - 1];
                const r = e.intersectionRect;
                if (!e.isIntersecting || r.height < 200) return;
                document.documentElement.style.setProperty('--vt', Math.round(r.top) + 'px');
                document.documentElement.style.setProperty('--vh', Math.round(r.height) + 'px');
            }, { threshold: th }).observe(alvo);
        })();

    </script>
</body>
</html>
