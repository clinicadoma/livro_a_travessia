<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light only">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Open+Sans:wght@400;600;700&family=Orbitron:wght@700;900&family=Roboto:wght@400;700;900&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;">

  <div id="doma-root">
    <p style="text-align:center;padding:60px 20px;font-family:sans-serif;color:#94a3b8;">
      Carregando a Travessia...
    </p>
  </div>

  <script>
  (function () {

    // ======================================================
    // 1) CONFIGURAÇÃO — troque pelos seus dados do GitHub
    // ======================================================
    var GH_USER = "clinicadoma";
    var GH_REPO = "livro_a_travessia";
    var GH_REF  = "main";

    // Usamos raw.githubusercontent.com em vez do jsDelivr. O jsDelivr nos
    // mordeu repetidas vezes com cache "preso" por horas numa referência
    // de branch como "main", mesmo com quebra-cache na URL. O
    // raw.githubusercontent.com libera CORS (necessário pra buscar de
    // dentro do iframe do Wix) e usa um cache bem mais curto (5 minutos),
    // que o quebra-cache abaixo ainda assim ignora por completo.
    var BASE_REPO  = "https://raw.githubusercontent.com/" + GH_USER + "/" + GH_REPO + "/" + GH_REF + "/";

    // ======================================================
    // QUEBRA-CACHE AUTOMÁTICO
    //
    // Colamos um parâmetro diferente a cada carregamento de página em
    // TODAS as URLs buscadas — isso faz qualquer camada de cache no meio
    // do caminho (CDN ou navegador) tratar cada carregamento como uma URL
    // nova, sempre buscando o conteúdo mais recente na origem.
    //
    // Custo: cada visita busca os arquivos "quentes" (sem cache), então
    // fica um pouco mais lento do que um CDN em cache normalmente
    // permitiria — mas para esse projeto, confiabilidade importa mais do
    // que os milissegundos economizados.
    // ======================================================
    var CACHE_BUST = "?_cb=" + Date.now();
    console.log("[doma-loader] quebra-cache desta carga:", CACHE_BUST);

    // ======================================================
    // MODO DE TESTE — para testar um slide específico fora do Wix.
    // Abra este arquivo direto no navegador com parâmetros na URL, ex:
    //   wix-loader.html?teste=1&ir=pag-jogo-insights
    // ?teste=1   -> libera VIP e ignora a trava de "página ainda não
    //               alcançada", permitindo pular pra qualquer slide.
    // ?ir=ID     -> depois de carregar, pula direto para esse id.
    // ======================================================
    var paramsURL = new URLSearchParams(window.location.search);
    var modoTeste = paramsURL.get('teste') === '1';
    var irDireto = paramsURL.get('ir');
    if (modoTeste) {
      window.__domaModoTeste = true;
      console.log("[doma-loader] MODO DE TESTE ativado (VIP liberado, sem travas de progresso).");
    }

    var BASE        = BASE_REPO;
    var BASE_CHUNKS = BASE + "html/chunks/";

    // ======================================================
    // 2) SHIM — ESSENCIAL, e agora "recarregável".
    //
    // Vários scripts legados fazem sua configuração dentro de
    // document.addEventListener('DOMContentLoaded', ...) ou de
    // window.onload = fn. Isso já disparou há muito tempo na página
    // do Wix, então:
    //   a) interceptamos esses registros e os disparamos uma vez,
    //      no próximo tick;
    //   b) GUARDAMOS cada callback registrado, para que o motor de
    //      navegação (core.js) possa "re-tocar" todos eles de novo
    //      toda vez que um novo capítulo for injetado — assim,
    //      configurações que dependem de elementos de um capítulo
    //      ainda não carregado simplesmente tentam de novo mais
    //      tarde e funcionam quando o capítulo certo finalmente
    //      existir no DOM.
    // ======================================================
    var callbacksDCL = [];

    // Quando um capítulo lazy é injetado, seus próprios scripts são
    // reativados (ver domaAtivarScripts em core.js). Nesse momento, TODO
    // elemento daquele capítulo já existe — então qualquer DOMContentLoaded
    // registrado por ESSE script específico sempre vai encontrar seus
    // elementos de cara, na primeira tentativa. Registrar esses callbacks
    // na lista de retentativa geral só serve para duplicá-los toda vez que
    // outro capítulo carregar depois (ex: um jogo de arrastar-e-soltar que
    // reanexa seus listeners de clique a cada capítulo novo, duplicando a
    // ação). Por isso, core.js liga essa bandeira momentaneamente enquanto
    // reativa os scripts de um capítulo específico.
    window.__domaSuprimirRegistroRefire = false;

    function prepararAmbienteParaModulosLegados() {
      [document, window].forEach(function (alvo) {
        var addOriginal = alvo.addEventListener.bind(alvo);
        alvo.addEventListener = function (tipo, cb, opts) {
          if (tipo === 'DOMContentLoaded') {
            if (!window.__domaSuprimirRegistroRefire) callbacksDCL.push(cb);
            setTimeout(function () { try { cb(); } catch (e) { /* elemento de um capítulo ainda não carregado */ } }, 0);
            return;
          }
          return addOriginal(tipo, cb, opts);
        };
      });

      // Cobre padrões do tipo: window.onload = minhaFuncao;
      var _onloadReal = null;
      try {
        Object.defineProperty(window, 'onload', {
          configurable: true,
          get: function () { return _onloadReal; },
          set: function (fn) {
            _onloadReal = fn;
            if (typeof fn === 'function') {
              if (!window.__domaSuprimirRegistroRefire) callbacksDCL.push(fn);
              setTimeout(function () { try { fn(); } catch (e) { /* elemento de um capítulo ainda não carregado */ } }, 0);
            }
          }
        });
      } catch (e) { /* alguns navegadores antigos podem já ter essa prop não-configurável */ }

      // Exposto para o core.js chamar depois de injetar cada capítulo novo.
      // Cada callback roda isolado (try/catch) para que um erro em um deles
      // (por ex. um elemento de OUTRO capítulo que ainda não existe) não
      // impeça os demais de rodar.
      window.__domaRefireDCL = function () {
        callbacksDCL.forEach(function (cb) {
          try { cb(); } catch (e) { /* silencioso: o elemento alvo ainda não existe */ }
        });
      };
    }

    // ======================================================
    // 3) CARREGADORES
    // ======================================================
    function buscarTexto(url) {
      return fetch(url, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("Falha ao buscar " + url + " (HTTP " + r.status + ")");
        return r.text();
      });
    }

    function buscarJSON(url) {
      return fetch(url, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("Falha ao buscar " + url + " (HTTP " + r.status + ")");
        return r.json();
      });
    }

    function injetarCSS(css) {
      // Importante: cada <style> do arquivo original é uma folha de estilo
      // INDEPENDENTE no navegador. Se juntássemos tudo numa única tag,
      // um erro de sintaxe (ex: uma tag <style> que "engole" texto que não
      // deveria por engano) corromperia a leitura de TODO o restante do
      // arquivo combinado. Recriamos cada bloco original como sua própria
      // tag <style>, preservando o isolamento que existia antes.
      var blocos = css.split("/* ===== próximo <style> ===== */");
      blocos.forEach(function (bloco) {
        var tag = document.createElement('style');
        tag.textContent = bloco;
        document.head.appendChild(tag);
      });

      // SCROLL INTERNO EM TODOS OS SLIDES.
      // O arquivo original faz cada slide crescer (height:auto;
      // overflow:visible) e depende do iframe do Wix esticar junto via
      // postMessage. Essa dependência é frágil. Esta regra, injetada por
      // último (então vence a cascata), trava a altura de cada slide
      // ativo na altura visível do PRÓPRIO IFRAME (100dvh) e liga a
      // rolagem interna — assim o usuário sempre consegue ver o slide
      // inteiro, mesmo que a altura do iframe não acompanhe perfeitamente.
      var overrideScroll = document.createElement('style');
      overrideScroll.textContent = [
        '.doma-pagina.ativa {',
        '  height: 100dvh !important;',
        '  max-height: 100dvh !important;',
        '  overflow-y: auto !important;',
        '  -webkit-overflow-scrolling: touch !important;',
        '}',
        '.doma-popup-tela {',
        '  max-height: 100dvh !important;',
        '  overflow-y: auto !important;',
        '  -webkit-overflow-scrolling: touch !important;',
        '}',
        // O arquivo original tem DUAS regras (comentadas como "DESTRAVA
        // TODOS OS MODAIS" e, literalmente, "MATA O SCROLL INTERNO") que
        // usam SELETORES POR ID para forçar altura automática e
        // overflow:visible numa lista específica de popups e seus
        // conteúdos internos. Seletor por ID sempre vence seletor por
        // classe (como .doma-popup-tela acima), não importa a ordem no
        // documento — por isso repetimos aqui a MESMA lista de seletores,
        // com a mesma especificidade, pra garantir que nossa regra vença.
        '#CAMADA_ABSOLUTA_LIVRO, #modal-loja-doma, #slide-final-conclusao,',
        '#slide-plano-acao, #slide-data-inicio, #slide-contrato {',
        '  max-height: 100dvh !important;',
        '  overflow-y: auto !important;',
        '  -webkit-overflow-scrolling: touch !important;',
        '}',
        '#slide-final-conclusao .wrapper-isolado,',
        '#modal-tatica-popup > div,',
        '#modal-tatica-popup > div > div,',
        '#modal-info-peca .alerta-clinico-modal,',
        '#modal-dossie-doma > div,',
        '#modal-dossie-doma > div > div,',
        '#modal-limite-giros .alerta-piscante,',
        '#modal-senha-vip > div,',
        '#slide-plano-acao .cartao-popup,',
        '#slide-data-inicio .cartao-popup,',
        '#slide-contrato .cartao-popup,',
        '.doma-popup-tela .wrapper-isolado {',
        '  overflow-y: auto !important;',
        '  max-height: 100% !important;',
        '  -webkit-overflow-scrolling: touch !important;',
        '}',
        // TELA "QUAL É O DESTINO DESSA PEÇA": o rótulo flutuante de cada
        // cesto (.cesto-label) fica 45px acima da caixa, mas a margem
        // antes da área de cestos só dava 30px de folga — sobrepondo a
        // legenda "0/10" da barra de progresso logo acima. Aumentamos essa
        // margem para dar espaço de sobra ao rótulo flutuante.
        '.area-cestos {',
        '  margin-top: 65px !important;',
        '}'
      ].join('\n');
      document.head.appendChild(overrideScroll);
    }

    function injetarJS(js) {
      // Tag <script> real (não eval), para que as funções fiquem
      // disponíveis globalmente (usadas em onclick="...").
      // Scripts inline sem "src" executam de forma síncrona neste append.
      var tag = document.createElement('script');
      tag.textContent = js;
      document.body.appendChild(tag);
    }

    var root = document.getElementById('doma-root');

    prepararAmbienteParaModulosLegados();

    Promise.all([
      buscarJSON(BASE + "manifest.json" + CACHE_BUST),
      buscarTexto(BASE + "css/style.css" + CACHE_BUST),
      buscarTexto(BASE + "js/core.js" + CACHE_BUST)
    ])
    .then(function (resultados) {
      var manifest = resultados[0];
      var css = resultados[1];
      var coreJs = resultados[2];

      injetarCSS(css);
      // Recria o #doma-app-wrapper: no arquivo original, TODAS as páginas e
      // popups viviam dentro dele, e o CSS dele (position:absolute; z-index:100)
      // é o que garante que os modais (z-index bem mais alto) fiquem por cima
      // das páginas. Sem recriar esse elemento, cada capítulo vira um <div>
      // solto sem contexto de empilhamento em comum, e os modais podem
      // renderizar ATRÁS do slide ativo.
      root.innerHTML = '<div id="doma-app-wrapper"></div>';
      injetarJS(coreJs);   // define domaCarregarCapitulo, mudarPagina, irParaTela, etc.

      // __domaBootstrap já carrega o capítulo inicial (índice 0: áudios,
      // carteira, modal, primeiras páginas) e inicializa a navegação.
      // O 3º argumento é o mesmo quebra-cache, repassado para toda busca
      // de capítulo feita depois (dentro do core.js).
      return window.__domaBootstrap(manifest, BASE_CHUNKS, CACHE_BUST).then(function () {
        if (irDireto) {
          console.log("[doma-loader] pulando direto para:", irDireto);
          return window.irParaTela(irDireto);
        }
      });
    })
    .catch(function (err) {
      console.error("Doma loader:", err);
      root.innerHTML = "<p style='padding:30px;text-align:center;color:#900;font-family:sans-serif;'>" +
        "Não foi possível carregar o conteúdo. Recarregue a página.</p>";
    });

  })();
  </script>

</body>
</html>
